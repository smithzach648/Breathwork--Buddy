name: Deploy Breathwork Buddy to Pages

on:
  push:
    branches: [breathwork-buddy-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/breathwork-buddy-2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build production PWA
        run: pnpm build
      - name: Check project-path PWA artifact
        run: node scripts/check-pwa-build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
